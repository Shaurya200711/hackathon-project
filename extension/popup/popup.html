```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TabFlow Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="app-container">

    <!-- HEADER -->
    <header class="app-header">

      <div class="brand">
        <span class="material-symbols-outlined brand-icon">
          tab
        </span>

        <h1 class="brand-title">
          TabFlow
        </h1>
      </div>


      <nav class="header-actions">

        <!-- GROUP -->
        <div class="dropdown">

          <button
            id="group-btn"
            class="btn btn-primary dropdown-toggle"
            type="button">

            <span class="material-symbols-outlined">
              auto_awesome
            </span>

            <span>Group</span>

            <span class="material-symbols-outlined arrow">
              expand_more
            </span>

          </button>


          <div class="dropdown-menu">

            <button id="group-domain">
              <span class="material-symbols-outlined">
                language
              </span>
              Group by Domain
            </button>

            <button id="group-window">
              <span class="material-symbols-outlined">
                window
              </span>
              Group by Window
            </button>

            <button id="remove-groups">
              <span class="material-symbols-outlined">
                tab_unselected
              </span>
              Remove Groups
            </button>

          </div>

        </div>


        <!-- SORT -->
        <div class="dropdown">

          <button
            id="sort-btn"
            class="btn btn-secondary dropdown-toggle"
            type="button">

            <span class="material-symbols-outlined">
              sort_by_alpha
            </span>

            <span>Sort</span>

            <span class="material-symbols-outlined arrow">
              expand_more
            </span>

          </button>


          <div class="dropdown-menu">

            <button id="sort-domain">
              <span class="material-symbols-outlined">
                language
              </span>
              Sort by Website
            </button>

            <button id="sort-title">
              <span class="material-symbols-outlined">
                title
              </span>
              Sort by Title
            </button>

            <button id="sort-recent">
              <span class="material-symbols-outlined">
                schedule
              </span>
              Recently Used
            </button>

          </div>

        </div>


        <!-- DEDUPE -->
        <div class="dropdown">

          <button
            id="dedup-btn"
            class="btn btn-secondary dropdown-toggle"
            type="button">

            <span class="material-symbols-outlined">
              content_copy
            </span>

            <span>Dedupe</span>

            <span class="material-symbols-outlined arrow">
              expand_more
            </span>

          </button>


          <div class="dropdown-menu">

            <button id="dedup-url">
              <span class="material-symbols-outlined">
                link
              </span>
              Duplicate URLs
            </button>

            <button id="dedup-domain">
              <span class="material-symbols-outlined">
                language
              </span>
              Duplicate Domains
            </button>

          </div>

        </div>


        <!-- POP OUT -->
        <button
          id="popout-btn"
          class="icon-btn"
          type="button">

          <span class="material-symbols-outlined">
            open_in_new
          </span>

        </button>

      </nav>

    </header>


    <!-- MAIN -->
    <main class="app-body">

      <div class="search-container">

        <span class="material-symbols-outlined search-icon">
          search
        </span>

        <input
          type="search"
          id="search-input"
          placeholder="Search tabs by title or URL..."
          autocomplete="off">

        <button
          id="clear-search-btn"
          class="icon-btn hidden"
          type="button">

          <span class="material-symbols-outlined">
            close
          </span>

        </button>

      </div>


      <div class="list-wrapper">

        <ul
          id="tab-list"
          class="tab-list">
        </ul>


        <div
          id="empty-state"
          class="empty-state hidden">

          <span class="material-symbols-outlined">
            tab_unselected
          </span>

          <p>
            No open tabs match your query.
          </p>

        </div>

      </div>

    </main>


    <!-- FOOTER -->
    <footer class="app-footer">

      <span
        id="tab-count"
        class="badge">
        0 tabs
      </span>

    </footer>

  </div>


  <!-- IMPORTANT -->
  <script src="popup.js"></script>

</body>

</html>
```
